<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Automation Studio</title>
    <!--
      The theme class has to be on <html> before the first paint. The module in
      src/theme.tsx only runs once the document and stylesheet have been parsed,
      so a light-preference user would see one dark frame before React mounts.

      The storage key and class names below are duplicated from src/theme.tsx
      (THEME_STORAGE_KEY, THEME_CLASS). src/theme.tsx stays the source of truth;
      if you change them there, change them here too.
    -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("cas.theme");
        } catch (error) {
          // Storage can be blocked; the system preference below still applies.
        }
        var prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : prefersDark
              ? "dark"
              : "light";
        var root = document.documentElement;
        root.classList.toggle("theme-light", theme === "light");
        root.classList.toggle("theme-dark", theme === "dark");
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
